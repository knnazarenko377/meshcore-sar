# Place this file in your fork as: .github/workflows/android-release.yml
# Run: Actions -> "Android Release" -> Run workflow (enter a tag, e.g. v1.0.0)
# or push a tag:  git tag v1.0.0 && git push origin v1.0.0
name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Optional: real release signing. Add these repo secrets in your fork:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Configure signing (if secrets exist)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<PROPS
          storePassword=$KS_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
            echo "Signing configured."
          else
            echo "No signing secrets - Gradle default (debug) signing will be used."
          fi

      - run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/meshcore-sar-universal.apk
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            cp "$f" "dist/meshcore-sar-$(basename "$f" | sed 's/app-//; s/-release//')"
          done
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: MeshCore SAR ${{ github.event.inputs.tag || github.ref_name }} (Android)
          generate_release_notes: true
          files: dist/*.apk
